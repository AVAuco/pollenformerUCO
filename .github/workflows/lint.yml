# Runs every pre-commit hook on every file: the same checks as `pre-commit install`, enforced on each PR.
name: Lint

on:
  # No branch filter, so stacked PRs (based on another PR's branch) are checked too.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same versions as the `uvx` command at the top of .pre-commit-config.yaml.
  PYTHON_VERSION: "3.13"
  PRE_COMMIT_VERSION: "4.7.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Only pre-commit itself goes through uv; the hook environments are cached below.
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # This workflow holds the Python and pre-commit versions, so a bump in either rebuilds the hooks.
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.github/workflows/lint.yml') }}
      - name: Run pre-commit
        run: >-
          uvx --python "$PYTHON_VERSION" "pre-commit@$PRE_COMMIT_VERSION"
          run --all-files --show-diff-on-failure --color=always
        env:
          # The merge to main is the squash commit itself; the guard is for local commits only.
          SKIP: no-commit-to-branch
