# With squash and merge, the PR title becomes the commit message on main: keep it a Conventional Commit.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # e.g. "docs: add citation for the published paper", not "Docs: Add citation".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >
            The subject "{subject}" of the PR title "{title}" must start with a lowercase letter.
