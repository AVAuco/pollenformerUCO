# Monthly grouped PRs that bump the pinned actions and the Python lock file. The `ci:` and `build:`
# prefixes keep their titles valid for pr-title.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]
