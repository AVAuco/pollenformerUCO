# Single source of truth for linting, formatting and the git hooks, run through mise:
#   mise run setup:uv-env   # .venv with pre-commit pinned in uv.lock, plus the git hooks
#   mise run lint:all       # every commit-time hook on every file (what CI runs)
#   mise run lint:staged    # every commit-time hook on the staged files
# The git hooks are pre-commit's own (`pre-commit install`): commit-time hooks run on
# commit, and the hooks marked `stages: [pre-push]` run on push. Hooks that wrap a
# command call its mise task, so each command is defined once, in mise.toml.
# Each tool reads its own config (pyproject.toml for Ruff and import-linter,
# .prettierrc.yaml, .markdownlint-cli2.yaml, .yamllint.yaml): no hook adds its own rules.
# Keep minimum_pre_commit_version equal to pre-commit in uv.lock.
minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, pre-push]
# Hooks run on commit unless they say otherwise, so pushing does not lint everything again.
default_stages: [pre-commit]
default_language_version:
  # pre-commit downloads this Node for Prettier and markdownlint instead of using whatever is installed.
  node: "24.22.2"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      # These three also declare the pre-push stage in their manifest; keep them on commit.
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        # The README GIFs in static/ weigh up to 5.3 MB.
        args: ["--maxkb=6000"]
        stages: [pre-commit]
      - id: no-commit-to-branch
        # main only changes through squash-merged PRs.
        args: ["--branch", "main"]
      - id: debug-statements
      - id: detect-private-key

  # Python: lint and format with the rules in [tool.ruff] of pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3 # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Architecture contracts of [tool.importlinter] (layers, so no import cycles). It needs
  # the installed package, so its mise task runs it in the project environment.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: mise run lint:imports
        language: unsupported
        types: [python]
        pass_filenames: false

  # pyproject.toml against the PEP 517/621/639/735 schemas and the tool schemas of SchemaStore.
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject
        additional_dependencies:
          ["validate-pyproject-schema-store[all]==2026.10.30"]

  # uv.lock must match pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6 # keep in sync with uv in mise.toml
    hooks:
      - id: uv-lock

  # Formatter for Markdown, YAML and CITATION.cff (parsed as YAML through .prettierrc.yaml).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        files: \.(md|ya?ml|cff)$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # Schema validation: CITATION.cff against the official CFF 1.2.0 schema, and the GitHub config files.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-citation-file-format
      - id: check-github-workflows
      - id: check-dependabot

  # Secrets and tests, through their mise tasks (gitleaks is pinned in mise.toml).
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: mise run sec:gitleaks:staged
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: unit tests
        entry: mise run test:unit
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: gitleaks-history
        name: gitleaks (history)
        entry: mise run sec:gitleaks:history
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
