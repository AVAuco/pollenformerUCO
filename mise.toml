# Command interface of the repository: `mise tasks` lists every workflow, named
# domain:object:action.
# - mise pins the CLI tools below; uv provides Python (.python-version) and the locked
#   environment (uv.lock), pre-commit included.
# - pre-commit (.pre-commit-config.yaml) is the single source of truth for linting,
#   formatting and the git hooks: the lint:* tasks only run it, and its hooks call the
#   sec:* and test:* tasks defined here.
# - CI (.github/workflows/ci.yml) runs these same tasks; `mise run ci:check` mirrors it.
# tests/test_tooling_consistency.py checks that uv matches pyproject.toml, the uv-lock
# hook and demo/Dockerfile.

[tools]
uv = "0.13.6"
gitleaks = "8.30.1"

[settings]
# uv provides Python from .python-version; do not let mise install it as well.
idiomatic_version_file_enable_tools = []

# ---------------------------
# Setup
# ---------------------------

[tasks."setup:uv-env"]
description = "Sync .venv from uv.lock (package, demo extra, dev groups) and git hooks"
run = [
    "uv sync --locked --all-extras --all-groups",
    "{{ mise_bin }} run setup:git-hooks",
]

[tasks."setup:uv-lock"]
description = "Re-resolve uv.lock after editing dependencies in pyproject.toml"
run = "uv lock"

[tasks."setup:git-hooks"]
description = "Install the pre-commit and pre-push hooks of .pre-commit-config.yaml"
# --overwrite: replace any previous hook instead of keeping it as a "legacy" hook.
run = "uv run --locked pre-commit install --overwrite"

[tasks."setup:clean"]
description = "Remove build artifacts and caches"
run = """
rm -rf build dist .pytest_cache .ruff_cache .coverage coverage.xml
find . -type d -name __pycache__ -prune -exec rm -rf {} +
"""

# ---------------------------
# Lint and format (pre-commit is the source of truth)
# ---------------------------

[tasks."lint:all"]
description = "Run every commit-time pre-commit hook on every file (what CI runs)"
run = "uv run --locked pre-commit run --all-files"

[tasks."lint:staged"]
description = "Run every commit-time pre-commit hook on the staged files"
run = "uv run --locked pre-commit run"

[tasks."lint:hook"]
description = "Run one pre-commit hook on every file: mise run lint:hook ruff-check"
run = "uv run --locked pre-commit run --all-files"

[tasks."lint:imports"]
description = "Check the import-linter architecture contracts (layers, no cycles)"
run = "uv run --locked lint-imports"

# ---------------------------
# Security
# ---------------------------

[tasks."sec:gitleaks:staged"]
description = "Scan the staged changes for secrets"
run = "gitleaks git --staged --redact --no-banner"

[tasks."sec:gitleaks:history"]
description = "Scan the whole git history for secrets (what CI runs)"
run = "gitleaks git --redact --no-banner"

# ---------------------------
# Tests
# ---------------------------

[tasks."test:unit"]
description = "Run the unit tests (no network, no model artifacts)"
run = "uv run --locked pytest"

[tasks."test:cov"]
description = "Run the unit tests with branch coverage and its threshold (what CI runs)"
run = "uv run --locked pytest --cov --cov-report=term-missing --cov-report=xml"

[tasks."test:e2e"]
description = "Run the end-to-end tests with the released model and gallery"
env = { POLLENFORMER_ARTIFACTS = "1" }
run = "uv run --locked pytest -m artifacts"

# ---------------------------
# CI gate
# ---------------------------

[tasks."ci:check"]
description = "Run the CI quality gate locally: hooks, secrets, tests, package build"
run = [
    "{{ mise_bin }} run lint:all",
    "{{ mise_bin }} run sec:gitleaks:history",
    "{{ mise_bin }} run test:cov",
    "{{ mise_bin }} run build:dist",
]

# ---------------------------
# Model artifacts and demo assets
# ---------------------------

[tasks."artifacts:fetch"]
description = "Download and verify the model checkpoint and k-NN gallery"
run = "uv run --locked pollenformer fetch"

[tasks."assets:umap"]
description = "Build umap_xy.npz from the gallery (args: --index PATH --out PATH)"
# Isolated env: umap-learn pulls numba/llvmlite, which stay out of the project lock.
run = "uv run --isolated --no-project --with 'umap-learn>=0.5.6' python scripts/build_umap.py"

[tasks."assets:thumbs"]
description = "Build the optional neighbour-thumbnail pack (args: --images-root PATH)"
run = "uv run --locked python scripts/build_thumbs.py"

# ---------------------------
# Demo application
# ---------------------------

[tasks."app:demo:soft"]
description = "Run the Streamlit demo, public SOFT interface, on http://localhost:8501"
dir = "demo"
run = "uv run --locked streamlit run main.py -- --mode SOFT"

[tasks."app:demo:hard"]
description = "Run the Streamlit demo, expert HARD interface, on http://localhost:8501"
dir = "demo"
run = "uv run --locked streamlit run main.py -- --mode HARD"

# ---------------------------
# Hugging Face Space and the demo image
# .github/workflows/deploy-space.yml uploads the tree that hf:space:stage assembles, and
# the Space builds the image from it. docker:demo:build builds that same tree locally
# (linux/amd64, like the Space) to check a change before it is deployed; CI does not
# build the image.
# ---------------------------

[tasks."hf:space:stage"]
description = "Assemble the Hugging Face Space tree in build/space (what deploy uploads)"
# Standard library only: --no-project skips installing the package and torch.
run = "uv run --no-project python scripts/stage_space.py --out build/space"

[tasks."docker:demo:build"]
description = "Build the demo image from the Space tree, as the Hugging Face Space does"
depends = ["hf:space:stage"]
run = "docker build --platform linux/amd64 -t pollenformer-uco-demo:local build/space"

[tasks."docker:demo:run"]
description = "Run the demo image on http://localhost:8501, caching artifacts in a volume"
depends = ["docker:demo:build"]
run = """
docker run --rm --platform linux/amd64 -p 8501:8501 \
  -v pollenformer-uco-cache:/home/user/.cache pollenformer-uco-demo:local
"""

# ---------------------------
# Package build and version
# ---------------------------

[tasks."build:dist"]
description = "Build the sdist and wheel into dist/"
run = "uv build"

[tasks."version:get"]
description = "Print the package version from pyproject.toml"
run = "uv version --short"

[tasks."version:bump"]
description = "Bump the package version: mise run version:bump -- minor"
run = "uv version --bump"
